name: Compilar para Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:estatico
      # Bibliotecas de Visual C++ que necesita el motor de la IA local (Microsoft permite distribuirlas junto al programa)
      - name: Bibliotecas de Visual C++ para la IA local
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/vcrt | Out-Null
          foreach ($f in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') { Copy-Item "$env:SystemRoot\System32\$f" build/vcrt/ }
      - run: npm run dist:win
        env:
          # Firma de código: se usa solo si se configuran estos secretos en GitHub
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      # Antes de publicar: el programa empaquetado tiene que abrir y guardar (detecta archivos que falten en el instalador)
      - name: Probar el programa empaquetado
        run: node tests/empaquetado.js "dist/win-unpacked/Tiza.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: planeador-docente-windows
          path: dist/*.exe
      - name: Leer versión
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Tiza ${{ steps.version.outputs.v }}
          prerelease: ${{ contains(steps.version.outputs.v, '-') }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
            dist/beta*.yml
          body: |
            **Cómo instalar**
            - `Tiza-Setup-...exe`: instalador (crea acceso directo y se actualiza solo).
            - `Tiza-portable-...exe`: versión portable, se abre con doble clic sin instalar.

            Si Windows muestra "Windows protegió su PC", haz clic en **Más información → Ejecutar de todas formas**.
