name: Compilar para Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: planeador-docente-windows
          path: dist/*.exe
      - name: Publicar descarga
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Planeador Docente ${{ github.ref_name }}
          files: dist/*.exe
          body: |
            **Cómo instalar**
            - `Planeador Docente Setup ...exe`: instalador (crea acceso directo en el escritorio).
            - `PlaneadorDocente-portable-...exe`: versión portable, se abre con doble clic sin instalar.

            Si Windows muestra "Windows protegió su PC", haz clic en **Más información → Ejecutar de todas formas**.
