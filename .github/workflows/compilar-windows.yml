name: Compilar para Windows
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:estatico
      - run: npm run dist:win
        env:
          # Firma de código: se usa solo si se configuran estos secretos en GitHub
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: planeador-docente-windows
          path: dist/*.exe
      - name: Leer versión
        id: version
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: Tiza ${{ steps.version.outputs.v }}
          prerelease: ${{ contains(steps.version.outputs.v, '-') }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/*.yml
          body: |
            **Cómo instalar**
            - `Tiza-Setup-...exe`: instalador (crea acceso directo y se actualiza solo).
            - `Tiza-portable-...exe`: versión portable, se abre con doble clic sin instalar.

            Si Windows muestra "Windows protegió su PC", haz clic en **Más información → Ejecutar de todas formas**.
