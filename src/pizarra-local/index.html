<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pizarra Local</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--bg:#f2f2f2;--panel:#fff;--text:#1a1a1a;--muted:#6b6b6b;--border:#e3e3e3;--accent:#4262ff;--hover:#eef1ff;--shadow:0 2px 14px rgba(0,0,0,.12)}
body.dark{--bg:#1b1b1f;--panel:#26262b;--text:#eee;--muted:#a0a0a8;--border:#3a3a40;--hover:#34374d;--shadow:0 2px 14px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg);font-size:13px;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;display:block;touch-action:none}
.float{position:fixed;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);z-index:10}
button{font:inherit;color:inherit}
.tb{width:38px;height:38px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--text);display:grid;place-items:center;font-size:16px;padding:0;position:relative}
.tb:hover{background:var(--hover)}
.tb.active{background:var(--accent);color:#fff}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb .kbd{position:absolute;right:2px;bottom:1px;font-size:8px;opacity:.5}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.hsep{height:1px;width:28px;background:var(--border);margin:4px auto}
#topLeft{top:12px;left:12px;display:flex;align-items:center;gap:4px;padding:4px 8px 4px 4px}
#boardName{border:0;background:transparent;font:600 15px inherit;font-family:inherit;color:var(--text);padding:6px;border-radius:6px;width:220px;outline:none}
#boardName:hover,#boardName:focus{background:var(--hover)}
#saveState{color:var(--muted);font-size:11px;min-width:70px}
#topRight{top:12px;right:12px;display:flex;align-items:center;gap:2px;padding:4px}
#timerBtn{width:auto;padding:0 10px;font-variant-numeric:tabular-nums;gap:6px;display:flex}
#toolbar{left:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;padding:5px;gap:2px}
#panel{right:12px;top:66px;width:256px;max-height:calc(100% - 300px);overflow:auto;padding:12px;display:none}
#panel .ph{font-weight:700;font-size:13px;margin-bottom:8px}
#panel .sec{margin:10px 0}
#panel .lbl{font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.sws{display:flex;flex-wrap:wrap;gap:5px}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.18);cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.tr{background:linear-gradient(135deg,#fff 45%,#f24726 45%,#f24726 55%,#fff 55%)!important}
.btns{display:flex;flex-wrap:wrap;gap:4px}
.bt{border:1px solid var(--border);background:var(--panel);border-radius:6px;padding:5px 8px;cursor:pointer;min-width:30px;font-size:13px}
.bt:hover{background:var(--hover)}
.bt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bt.danger:hover{background:#ffe3e3;color:#c00}
#panel select,#panel input[type=text]{width:100%;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font:inherit}
#panel input[type=range]{width:100%}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.shapes .bt{padding:4px;display:grid;place-items:center}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.emojis .bt{font-size:18px;padding:3px;border:0}
#bottomRight{right:12px;bottom:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;background:transparent;border:0;box-shadow:none}
#zoomBar{display:flex;align-items:center;gap:2px;padding:4px;position:static}
#zoomPct{min-width:52px;text-align:center;cursor:pointer;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:6px;border-radius:6px}
#zoomPct:hover{background:var(--hover)}
#minimap{width:220px;height:140px;position:static;cursor:pointer;display:block}
#editor{position:fixed;display:none;z-index:5;border:0;outline:none;resize:none;overflow:hidden;background:transparent;padding:0;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;user-select:text;-webkit-user-select:text}
#sidebar{left:0;top:0;bottom:0;width:320px;border-radius:0 12px 12px 0;transform:translateX(-105%);transition:transform .2s;z-index:40;padding:16px;display:flex;flex-direction:column;gap:10px}
#sidebar.open{transform:none}
#sidebar h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#boardList{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px}
.brow{display:flex;align-items:center;gap:4px;padding:8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.brow:hover{background:var(--hover)}
.brow.cur{border-color:var(--accent)}
.brow .nm{flex:1;min-width:0}
.brow .nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm small{color:var(--muted)}
.brow .tb{width:28px;height:28px;font-size:13px}
.menu{position:fixed;z-index:60;padding:6px;display:none;min-width:220px}
.menu.open{display:block}
.menu .mi{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.menu .mi:hover{background:var(--hover)}
.menu .mi small{margin-left:auto;color:var(--muted)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
#search{top:66px;left:50%;transform:translateX(-50%);padding:6px;display:none;align-items:center;gap:6px}
#search input{border:0;outline:none;background:transparent;color:var(--text);font:inherit;font-size:14px;width:260px;padding:6px}
#searchCount{color:var(--muted);min-width:44px;text-align:right}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:center;justify-content:center}
#modalBg.open{display:flex}
#modal{position:relative;max-width:760px;width:92%;max-height:86vh;overflow:auto;padding:20px 24px;user-select:text}
#modal h2{margin-top:0}
#modal table{border-collapse:collapse;width:100%}
#modal td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}
#modal kbd{background:var(--hover);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:inherit;font-size:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:8px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#presUI{left:50%;bottom:20px;transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:4px 8px}
body.presenting .ui{display:none!important}
body.presenting #presUI{display:flex}
#timerPop{padding:10px;display:none;gap:6px;flex-direction:column}
#timerPop.open{display:flex}
#timerPop input{width:70px;padding:4px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text)}
#timerBtn.run{color:var(--accent);font-weight:700}
#timerBtn.done{background:#f24726;color:#fff}
#dropHint{position:fixed;inset:0;border:4px dashed var(--accent);z-index:90;display:none;pointer-events:none;background:rgba(66,98,255,.06)}
#richEditor{position:fixed;display:none;z-index:5;outline:none;overflow:hidden;padding:0;margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.3;white-space:pre-wrap;word-wrap:break-word;user-select:text;-webkit-user-select:text;box-sizing:border-box;caret-color:currentColor}
#richEditor ul,#richEditor ol{margin:0;padding-left:1.4em;text-align:inherit}
#richEditor ul.check{list-style:none}
#richEditor ul.check li{position:relative}
#richEditor ul.check li::before{content:'☐';position:absolute;left:-1.25em;cursor:pointer}
#richEditor:not(.al-left) li{list-style-position:inside}
#richEditor:not(.al-left) ul.check li::before{position:static;margin-right:.3em}
#richEditor ul.check li[data-checked="1"]::before{content:'☑';color:#4262ff}
#richEditor ul.check li[data-checked="1"]{text-decoration:line-through;opacity:.55}
#richBar{display:none;align-items:center;gap:1px;padding:3px;z-index:20}
#richBar.open{display:flex}
#richBar .tb{width:32px;height:32px;font-size:14px}
#richBar .tb.rw{width:auto;padding:0 6px;font-size:13px;white-space:nowrap}
#richBar .rsw.hl{border-radius:3px}
#richFontMenu{display:none;position:absolute;left:0;top:calc(100% + 6px);width:260px;max-height:320px;overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
#richFontMenu.open{display:block}
#richFontSearch{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);margin-bottom:4px;font:inherit}
#richSizeMenu{display:none;position:absolute;top:calc(100% + 6px);padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow)}
#richSizeMenu.open{display:block}
#richSizeMenu .fi{font-size:13px}
#richBar .rsw{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.25);cursor:pointer;padding:0;margin:0 1px;flex:none}
#cropBar{left:50%;bottom:20px;transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:6px 10px;z-index:30}
#cropBar.open{display:flex}
#fontPicker{width:270px;display:none;flex-direction:column;gap:6px}
#fontPicker.open{display:flex}
#fontSearch{width:100%;padding:7px;border:1px solid var(--border);border-radius:6px;background:var(--panel);color:var(--text);font:inherit;outline:none}
#fontSearch:focus{border-color:var(--accent)}
#fontList{overflow:auto;max-height:50vh}
.fi{padding:6px 8px;cursor:pointer;border-radius:6px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi:hover{background:var(--hover)}
.fi.on{background:var(--accent);color:#fff}
#cmtBadge{position:absolute;top:2px;right:0;background:#f24726;color:#fff;border-radius:8px;font-size:9px;padding:0 4px;line-height:14px}
#cmtBadge:empty{display:none}
#commentPop{width:310px;padding:0;display:none;flex-direction:column;max-height:440px;z-index:30}
#commentPop.open{display:flex}
.cp-head{display:flex;align-items:center;gap:2px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--border)}
.cp-head b{flex:1}
.cp-head .tb{width:30px;height:30px;font-size:14px}
.cp-msgs{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px;min-height:40px}
.cp-msg .meta{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.cp-msg .meta b{color:var(--text);font-size:12px}
.cp-msg .txt{white-space:pre-wrap;word-break:break-word;margin:3px 0 0 28px;user-select:text;-webkit-user-select:text}
.avatar{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:10px;flex:none}
.cp-foot{border-top:1px solid var(--border);padding:8px;display:flex;flex-direction:column;gap:6px}
.cp-foot textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--border);border-radius:6px;padding:6px;font:inherit;background:var(--panel);color:var(--text);user-select:text;-webkit-user-select:text;outline:none}
.cp-foot textarea:focus{border-color:var(--accent)}
.cp-foot a{color:var(--accent)}
#commentsPanel{width:330px;max-height:70vh;overflow:auto}
.cl-item{padding:8px;border-radius:6px;cursor:pointer;display:flex;gap:8px}
.cl-item:hover{background:var(--hover)}
.cl-item.res{opacity:.55}
/* [Planeador Docente] modo embebido: la lista de tableros la maneja el planeador */
body.embebido #menuBtn,body.embebido #sidebar{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<textarea id="editor" spellcheck="false"></textarea>
<div id="richEditor" contenteditable="true" spellcheck="false"></div>
<div id="richBar" class="float ui">
  <button class="tb" data-rc="bold" title="Negrita (Ctrl+B)"><b>N</b></button>
  <button class="tb" data-rc="italic" title="Cursiva (Ctrl+I)"><i>K</i></button>
  <button class="tb" data-rc="underline" title="Subrayado (Ctrl+U)"><u>S</u></button>
  <button class="tb" data-rc="strikeThrough" title="Tachado (Ctrl+Shift+X)"><s>T</s></button>
  <div class="sep"></div>
  <button class="tb rw" data-rc="fontMenu" title="Fuente de las letras seleccionadas (todas las fuentes del equipo)">Aa ▾</button>
  <button class="tb" data-rc="sizeDown" title="Letras seleccionadas más pequeñas">A−</button>
  <button class="tb rw" data-rc="sizeMenu" title="Tamaño de las letras seleccionadas">Tamaño ▾</button>
  <button class="tb" data-rc="sizeUp" title="Letras seleccionadas más grandes">A+</button>
  <div class="sep"></div>
  <span id="richColors" style="display:flex;align-items:center"></span>
  <div class="sep"></div>
  <span id="richHilites" style="display:flex;align-items:center" title="Resaltar las letras seleccionadas"></span>
  <div id="richFontMenu"><input id="richFontSearch" placeholder="Buscar fuente…" autocomplete="off"><div id="richFontList"></div></div>
  <div id="richSizeMenu"></div>
  <div class="sep"></div>
  <button class="tb" data-rc="ul" title="Lista con viñetas">•≡</button>
  <button class="tb" data-rc="ol" title="Lista numerada">1≡</button>
  <button class="tb" data-rc="check" title="Lista de tareas (casillas)">☑</button>
  <div class="sep"></div>
  <button class="tb" data-rc="removeFormat" title="Quitar formato de lo seleccionado">⌫</button>
</div>
<div id="cropBar" class="float ui">
  <b>✂ Recortar imagen</b><small style="color:var(--muted)">Arrastra los bordes · Enter aplica · Esc cancela</small>
  <button class="bt" id="cropReset">Restablecer</button><button class="bt" id="cropCancel">Cancelar</button><button class="bt on" id="cropApply">✓ Aplicar</button>
</div>

<div id="topLeft" class="float ui">
  <button class="tb" id="menuBtn" title="Tableros">☰</button>
  <input id="boardName" value="" title="Nombre del tablero">
  <span id="saveState"></span>
</div>

<div id="topRight" class="float ui">
  <button class="tb" id="undoBtn" title="Deshacer (Ctrl+Z)">↶</button>
  <button class="tb" id="redoBtn" title="Rehacer (Ctrl+Y)">↷</button>
  <div class="sep"></div>
  <button class="tb" id="searchBtn" title="Buscar (Ctrl+F)">🔍</button>
  <button class="tb" id="commentsBtn" title="Comentarios">💬<span id="cmtBadge"></span></button>
  <button class="tb" id="timerBtn" title="Temporizador">⏱</button>
  <button class="tb" id="presentBtn" title="Presentar marcos">▶</button>
  <button class="tb" id="exportBtn" title="Exportar / importar">⤓</button>
  <button class="tb" id="themeBtn" title="Modo oscuro">🌓</button>
  <button class="tb" id="helpBtn" title="Ayuda y atajos (?)">?</button>
</div>

<div id="toolbar" class="float ui"></div>
<div id="panel" class="float ui"></div>

<div id="bottomRight" class="float ui">
  <canvas id="minimap" class="float"></canvas>
  <div id="zoomBar" class="float">
    <button class="tb" id="gridBtn" title="Cuadrícula (G)">#</button>
    <button class="tb" id="snapBtn" title="Ajustar a cuadrícula">🧲</button>
    <button class="tb" id="mmBtn" title="Minimapa">🗺</button>
    <div class="sep"></div>
    <button class="tb" id="zoomOut" title="Alejar (Ctrl -)">−</button>
    <button id="zoomPct" title="Restablecer 100% (Ctrl+0)">100%</button>
    <button class="tb" id="zoomIn" title="Acercar (Ctrl +)">+</button>
    <button class="tb" id="fitBtn" title="Ver todo (Shift+1)">⛶</button>
  </div>
</div>

<div id="search" class="float ui">
  🔍<input id="searchInput" placeholder="Buscar texto en el tablero…">
  <span id="searchCount"></span>
  <button class="tb" id="searchPrev" title="Anterior">↑</button>
  <button class="tb" id="searchNext" title="Siguiente">↓</button>
  <button class="tb" id="searchClose" title="Cerrar">✕</button>
</div>

<div id="sidebar" class="float">
  <h3>Mis tableros <button class="tb" id="sideClose">✕</button></h3>
  <button class="bt" id="newBoard">＋ Nuevo tablero</button>
  <div id="boardList"></div>
  <button class="bt" id="importBoard">📂 Importar tablero (.json)</button>
  <small style="color:var(--muted)">Todo se guarda automáticamente en este navegador (IndexedDB). Exporta a .json para hacer copias de seguridad o pasarlos a otro equipo.</small>
</div>

<div id="exportMenu" class="menu float">
  <button class="mi" data-ex="png">🖼 Exportar tablero como PNG</button>
  <button class="mi" data-ex="pngsel">🖼 Exportar selección como PNG</button>
  <button class="mi" data-ex="svg">📐 Exportar como SVG (vectorial)</button>
  <button class="mi" data-ex="pdf">🖨 Imprimir / guardar PDF</button>
  <hr>
  <button class="mi" data-ex="json">💾 Guardar copia (.json)</button>
  <button class="mi" data-ex="import">📂 Importar tablero (.json)</button>
  <button class="mi" data-ex="insertimg">➕ Insertar imagen o PDF…</button>
</div>

<div id="templateMenu" class="menu float">
  <button class="mi" data-tpl="kanban">📋 Kanban</button>
  <button class="mi" data-tpl="retro">🔁 Retrospectiva</button>
  <button class="mi" data-tpl="swot">🧭 Análisis DAFO</button>
  <button class="mi" data-tpl="mindmap">🧠 Mapa mental</button>
  <button class="mi" data-tpl="flow">🔀 Diagrama de flujo</button>
  <button class="mi" data-tpl="brainstorm">💡 Lluvia de ideas</button>
  <button class="mi" data-tpl="eisenhower">⏳ Matriz de Eisenhower</button>
  <button class="mi" data-tpl="timeline">📅 Línea de tiempo</button>
  <button class="mi" data-tpl="userjourney">🧑 Mapa de empatía</button>
</div>

<div id="timerPop" class="menu float">
  <div class="btns">
    <button class="bt" data-min="1">1 min</button><button class="bt" data-min="3">3 min</button>
    <button class="bt" data-min="5">5 min</button><button class="bt" data-min="10">10 min</button>
  </div>
  <div style="display:flex;gap:6px;align-items:center">Minutos: <input type="number" id="timerMin" min="0.1" step="0.5" value="5"> <button class="bt" id="timerStart">Iniciar</button></div>
  <div class="btns"><button class="bt" id="timerPause">⏸ Pausa / seguir</button><button class="bt" id="timerReset">⏹ Parar</button></div>
</div>

<div id="presUI" class="float">
  <button class="tb" id="presPrev">◀</button><span id="presCount">1 / 1</span><button class="tb" id="presNext">▶</button>
  <div class="sep"></div><button class="tb" id="presExit" title="Salir (Esc)">✕</button>
</div>

<div id="fontPicker" class="menu float">
  <input id="fontSearch" placeholder="Buscar o escribir una fuente…" autocomplete="off">
  <div id="fontList"></div>
  <button class="bt" id="fontLoadSys" title="El navegador te pedirá permiso">🔤 Cargar todas las fuentes de mi equipo</button>
</div>
<div id="commentPop" class="float ui">
  <div class="cp-head"><b id="cpTitle">Comentario</b><button class="tb" id="cpResolve" title="Marcar como resuelto">✔</button><button class="tb" id="cpDelete" title="Eliminar hilo">🗑</button><button class="tb" id="cpClose" title="Cerrar (Esc)">✕</button></div>
  <div class="cp-msgs" id="cpMsgs"></div>
  <div class="cp-foot"><textarea id="cpInput" placeholder="Escribe… (Enter envía, Shift+Enter nueva línea)"></textarea>
  <div style="display:flex;gap:6px;align-items:center"><small style="color:var(--muted);flex:1">Como <a href="#" id="cpAuthor"></a></small><button class="bt on" id="cpSend">Enviar</button></div></div>
</div>
<div id="commentsPanel" class="menu float">
  <div style="display:flex;gap:10px;align-items:center;padding:4px 6px 8px"><b style="flex:1">💬 Comentarios</b>
   <label title="Mostrar también los resueltos"><input type="checkbox" id="clShowResolved"> resueltos</label>
   <label title="Mostrar los comentarios sobre el tablero"><input type="checkbox" id="clShow" checked> visibles</label></div>
  <div id="clList"></div>
</div>
<div id="modalBg"><div id="modal" class="float"></div></div>
<div id="toast"></div>
<div id="dropHint"></div>
<input type="file" id="fileImg" accept="image/*,application/pdf,.pdf" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   PIZARRA LOCAL — pizarra colaborativa infinita, 100% local
   ===================================================================== */
const $ = s => document.querySelector(s);
const canvas = $('#c'), ctx = canvas.getContext('2d');
const mctx = document.createElement('canvas').getContext('2d');
const editor = $('#editor');
const FONT = 'Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const IS_ELECTRON = /Electron/i.test(navigator.userAgent);

function present() {
  const frames = S.items.filter(i => i.type === 'frame');
  if (!frames.length) return toast('Crea al menos un marco (tecla F) para presentar');
  commitEdit(); S.presenting = {frames, i: 0}; S.sel.clear(); updatePanel();
  document.body.classList.add('presenting');
  document.documentElement.requestFullscreen?.().catch(() => {});
  setTimeout(() => goFrame(0), 150);
}
function goFrame(i) {
  const P = S.presenting; if (!P) return;
  P.i = clamp(i, 0, P.frames.length - 1); const f = P.frames[P.i];
  $('#presCount').textContent = `${P.i + 1} / ${P.frames.length} · ${f.title || ''}`;
  animateView(viewFor(f, 30, 20), 450);
}
function exitPresent() { S.presenting = null; document.body.classList.remove('presenting'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); requestRender(); }

function openSearch() { S.searchOpen = true; $('#search').style.display = 'flex'; $('#searchInput').focus(); $('#searchInput').select(); runSearch(false); }
function closeSearch() { S.searchOpen = false; $('#search').style.display = 'none'; S.searchHits = []; S.searchIdx = -1; requestRender(); }
function runSearch(jump) {
  const q = $('#searchInput').value.trim().toLowerCase();
  S.searchHits = q ? S.items.filter(i => ((i.text || '') + ' ' + (i.title || '') + ' ' + (i.author || '') + ' ' + (i.thread || []).map(m => m.author + ' ' + m.text).join(' ')).toLowerCase().includes(q)).map(i => i.id) : [];
  if (S.searchIdx >= S.searchHits.length) S.searchIdx = -1;
  if (jump && S.searchHits.length) searchStep(0, true);
  $('#searchCount').textContent = q ? (S.searchHits.length ? `${S.searchIdx + 1}/${S.searchHits.length}` : '0') : '';
  requestRender();
}
function searchStep(d, reset) {
  if (!S.searchHits.length) return;
  S.searchIdx = reset ? 0 : (S.searchIdx + d + S.searchHits.length) % S.searchHits.length;
  const it = byId(S.searchHits[S.searchIdx]); if (it) animateView(viewFor(bounds(it), 200, 1.5));
  $('#searchCount').textContent = `${S.searchIdx + 1}/${S.searchHits.length}`; requestRender();
}
$('#searchBtn').onclick = openSearch; $('#searchClose').onclick = closeSearch;
$('#searchInput').addEventListener('input', () => { S.searchIdx = -1; runSearch(true); });
$('#searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchStep(e.shiftKey ? -1 : 1); if (e.key === 'Escape') closeSearch(); });
$('#searchNext').onclick = () => searchStep(1); $('#searchPrev').onclick = () => searchStep(-1);

$('#timerStart').onclick = () => { timerStart(+$('#timerMin').value || 5); closeMenus(); };
$('#timerPause').onclick = () => { if (Timer.running) { Timer.left = Timer.end - Date.now(); Timer.running = false; } else if (Timer.left > 0) { Timer.end = Date.now() + Timer.left; Timer.running = true; } timerTick(); };
$('#timerReset').onclick = () => { timerReset(); closeMenus(); };

  const row = e.target.closest('[data-cid]'), it = row && byId(row.dataset.cid); if (!it) return;
  closeMenus(); S.sel = new Set([it.id]); updatePanel();
  const z = Math.max(S.view.z, 0.8); animateView({z, x: innerWidth / 2 - it.x * z, y: innerHeight / 2 - it.y * z});
  setTimeout(() => openCommentPop(it.id), 400);
});
$('#clShowResolved').onchange = e => { S.showResolved = e.target.checked; renderCommentsList(); requestRender(); };
$('#clShow').onchange = e => { S.showComments = e.target.checked; if (!S.showComments) { hideCommentPop(); for (const id of [...S.sel]) if (byId(id)?.type === 'comment') S.sel.delete(id); } requestRender(); };

/* ---------------- [Planeador Docente] Puente con el planeador ----------------
   Cuando la pizarra se abre dentro del Planeador Docente (iframe), los tableros se guardan en los datos
   del planeador (vinculados a la sesión y a los grupos) en lugar de IndexedDB. */
const EMBEBIDO = window.parent !== window;
const PUENTE = {board: null, recursos: ''};
function puenteEnviar(m) { parent.postMessage(Object.assign({origen: 'pizarra-local'}, m), '*'); }
function puenteMiniatura() {
  const cv = S.items.length ? renderToCanvas(false, 0.5) : null; if (!cv) return '';
  const k = Math.min(1, 480 / Math.max(cv.width, cv.height)), m = document.createElement('canvas');
  m.width = Math.max(1, Math.round(cv.width * k)); m.height = Math.max(1, Math.round(cv.height * k));
  m.getContext('2d').drawImage(cv, 0, 0, m.width, m.height);
  return m.toDataURL('image/jpeg', 0.8);
}
// Inserta elementos enviados por el planeador (coordenadas relativas); los conectores usan los "ref" de otros elementos.
function puenteInsertar(specs) {
  commitEdit();
  const refs = new Map(), items = [];
  for (const sp of specs.filter(x => x.type !== 'connector')) { const {ref, ...props} = sp; const it = mk(sp.type, props); if (ref) refs.set(ref, it.id); items.push(it); }
  if (!items.length) return;
  const b = unionBounds(items.map(bounds)), c = viewCenter();
  let dx = c.x - (b.x + b.w / 2), dy = c.y - (b.y + b.h / 2);
  const cb = contentBounds(), dest = {x: b.x + dx, y: b.y + dy, w: b.w, h: b.h};
  if (cb && S.items.some(i => { const o = bounds(i); return o.x < dest.x + dest.w && o.x + o.w > dest.x && o.y < dest.y + dest.h && o.y + o.h > dest.y; })) { dx = cb.x + cb.w + 200 - b.x; dy = cb.y - b.y; }
  for (const it of items) { it.x += dx; it.y += dy; }
  for (const sp of specs.filter(x => x.type === 'connector')) {
    const {ref, from, to, ...props} = sp;
    items.push(mk('connector', Object.assign(props, {from: {id: refs.get(from)}, to: {id: refs.get(to)}})));
  }
  mutate(() => { addItems(items); S.sel = new Set(items.filter(i => i.type !== 'connector').map(i => i.id)); });
  animateView(viewFor(unionBounds(items.map(bounds)), 80, 1));
}
if (EMBEBIDO) {
  document.body.classList.add('embebido');
  Store.init = async () => {};
  Store.all = async () => PUENTE.board ? [PUENTE.board] : [];
  Store.del = async () => {};
  Store.put = async b => {
    PUENTE.board = b;
    const claves = Object.keys(b.assets || {}).sort().join(','), m = {tipo: 'guardar', id: b.id, nombre: b.name, items: b.items, view: b.view, updated: b.updated};
    if (claves !== PUENTE.recursos) { m.assets = b.assets; PUENTE.recursos = claves; }
    puenteEnviar(m);
  };
  // PDF: se genera con el planeador (mismo diálogo de guardar que el resto de la app)
  printPDF = function () { const cv = renderToCanvas(false, 2); if (cv) puenteEnviar({tipo: 'pdf', nombre: safeName(), imagen: cv.toDataURL('image/png'), ancho: cv.width, alto: cv.height}); };
  // Si el planeador cierra la vista mientras queda un cambio pendiente, se envía de inmediato
  window.addEventListener('pagehide', () => { if (saveTimer) saveNow(); });
  window.addEventListener('message', async e => {
    if (e.source !== parent) return; const m = e.data || {};
    if (m.tipo === 'abrir') { PUENTE.board = m.tablero; PUENTE.recursos = Object.keys(m.tablero.assets || {}).sort().join(','); await openBoard(m.tablero.id); requestRender(); }
    else if (m.tipo === 'insertar') puenteInsertar(m.elementos || []);
    else if (m.tipo === 'nombre') { if (S.board) { S.board.name = m.nombre; $('#boardName').value = m.nombre; scheduleSave(); } }
    else if (m.tipo === 'cerrar') { commitEdit(); if (saveTimer || m.forzar) await saveNow(); puenteEnviar({tipo: 'cerrado', miniatura: puenteMiniatura()}); }
  });
}

/* ---------------- Inicio ---------------- */
window.addEventListener('resize', requestRender);
window.addEventListener('beforeunload', () => { if (saveTimer) saveNow(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && saveTimer) saveNow(); });
(async function init() {
  document.body.classList.toggle('dark', S.dark);
  $('#gridBtn').classList.toggle('active', S.grid); $('#snapBtn').classList.toggle('active', S.snap); $('#mmBtn').classList.toggle('active', S.minimap);
  setToolQuiet('select'); updateUndoBtns(); updateCommentBadge();
  if (EMBEBIDO) { puenteEnviar({tipo: 'listo'}); return; } // [Planeador Docente] el tablero lo envía el planeador
  await Store.init();
  const all = await Store.all(), last = localStorage.getItem('pizarra-last');
  if (!all.length) await newBoard('Mi primer tablero', true);
  else await openBoard(all.find(b => b.id === last) ? last : all.sort((a, b) => (b.updated || 0) - (a.updated || 0))[0].id);
  requestRender();
})();
</script>
</body>
