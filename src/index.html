<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Planeador Docente</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="menu">
    <div class="marca">
      <img class="logo" src="icono.svg" alt="" style="width:36px;height:36px">
      <div>
        <div class="marca-titulo">Planeador Docente</div>
        <div class="marca-sub" id="marca-sub">Educación básica y media</div>
      </div>
    </div>
    <div class="buscador"><input placeholder="🔎 Buscar…  (Ctrl+K)" onfocus="this.blur();abrirBuscador()" readonly></div>
    <nav id="nav"></nav>
    <div class="menu-pie"><div class="fila" style="justify-content:space-between;margin-bottom:6px">
      <span><button title="Tema claro / oscuro" onclick="cambiarTema(document.body.classList.contains('oscuro') ? 'claro' : 'oscuro')">🌓</button> <button title="Personalizar el menú (ocultar y ordenar módulos)" onclick="ir('configuracion');setTimeout(()=>document.getElementById('tarjeta-menu')?.scrollIntoView({behavior:'smooth'}),80)">☰</button></span>
      <span><button title="Letra más pequeña" onclick="cambiarZoom(-1)">A−</button> <button title="Letra más grande" onclick="cambiarZoom(1)">A+</button></span></div>
      <div id="estado-guardado">Datos guardados en este equipo</div></div>
  </aside>
  <main id="contenido"></main>
  <div id="modal-fondo" class="oculto"><div id="modal"></div></div>
  <div id="avisos"></div>

  <script src="app.js"></script>
  <script src="grupos.js"></script>
  <script src="planeaciones.js"></script>
  <script src="plantillas.js"></script>
  <script src="curricular.js"></script>
  <script src="referentes-datos.js"></script>
  <script src="referentes.js"></script>
  <script src="cobertura.js"></script>
  <script src="banco-inicial.js"></script>
  <script src="banco-pedagogico.js"></script>
  <script src="evaluacion.js"></script>
  <script src="programacion.js"></script>
  <script src="importar-notas.js"></script>
  <script src="retro.js"></script>
  <script src="apoyo.js"></script>
  <script src="boletin.js"></script>
  <script src="piar.js"></script>
  <script src="perfil.js"></script>
  <script src="calendario.js"></script>
  <script src="horario.js"></script>
  <script src="diario.js"></script>
  <script src="seguimiento.js"></script>
  <script src="riesgo.js"></script>
  <script src="informe.js"></script>
  <script src="comunicados.js"></script>
  <script src="alertas.js"></script>
  <script src="pruebas.js"></script>
  <script src="omr.js"></script>
  <script src="fichas.js"></script>
  <script src="aula.js"></script>
  <script src="gamificacion.js"></script>
  <script src="buscador.js"></script>
  <script src="compartir.js"></script>
  <script src="voz.js"></script>
  <script src="configuracion.js"></script>
  <script>iniciar();</script>
</body>
</html>
