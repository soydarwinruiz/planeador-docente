<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Tiza</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside id="menu">
    <div class="marca">
      <img class="logo" src="icono.svg" alt="" style="width:36px;height:36px">
      <div>
        <div class="marca-titulo">Tiza</div>
        <div class="marca-sub" id="marca-sub">Planeador docente</div>
      </div>
      <button class="plegar-menu" title="Ocultar el menú (Ctrl + B)" aria-label="Ocultar el menú" onclick="alternarBarraLateral()">«</button>
    </div>
    <div class="buscador"><input placeholder="🔎 Buscar…  (Ctrl+K)" onfocus="this.blur();abrirBuscador()" readonly><button class="buscador-ico" title="Buscar (Ctrl + K)" aria-label="Buscar" onclick="abrirBuscador()">🔎</button></div>
    <nav id="nav"></nav>
    <div class="menu-pie"><div class="fila" style="justify-content:space-between;margin-bottom:6px">
      <span><button title="Tema claro / oscuro" onclick="cambiarTema(document.body.classList.contains('oscuro') ? 'claro' : 'oscuro')">🌓</button> <button title="Personalizar el menú (ocultar y ordenar módulos)" onclick="irAConfig('apariencia','tarjeta-menu')">🧭</button> <button id="boton-compacto" title="Menú compacto (solo íconos)" onclick="alternarCompacto()">⇤</button> <button id="boton-bloquear" title="Bloquear el programa (Ctrl + L)" onclick="bloquearAhora()" hidden>🔒</button></span>
      <span><button title="Letra más pequeña" onclick="cambiarZoom(-1)">A−</button> <button title="Letra más grande" onclick="cambiarZoom(1)">A+</button></span></div>
      <div id="estado-guardado">Datos guardados en este equipo</div></div>
  </aside>
  <button id="mostrar-menu" title="Mostrar el menú (Ctrl + B)" aria-label="Mostrar el menú" onclick="alternarBarraLateral()">☰</button>
  <button id="salir-enfoque" title="Salir del modo enfoque (Ctrl + Shift + B)" onclick="alternarEnfoque()">⤡ Salir del modo enfoque</button>
  <main id="contenido"></main>
  <div id="modal-fondo" class="oculto"><div id="modal"></div></div>
  <div id="avisos"></div>

  <script src="app.js"></script>
  <script src="grupos.js"></script>
  <script src="planeaciones.js"></script>

  <script src="evaluacion.js"></script>

  <script src="registro-notas.js"></script>
  <script src="entregas.js"></script>
  <script src="miclase.js"></script>
  <script src="semana.js"></script>
  <script src="material.js"></script>
  <script src="acerca.js"></script>
  <script src="importar-notas.js"></script>
  <script src="retro.js"></script>
  <script src="apoyo.js"></script>
  <script src="boletin.js"></script>
  <script src="piar.js"></script>
  <script src="perfil.js"></script>
  <script src="calendario.js"></script>
  <script src="horario.js"></script>
  <script src="diario.js"></script>
  <script src="seguimiento.js"></script>
  <script src="riesgo.js"></script>

  <script src="banco-preguntas.js"></script>
  <script src="omr.js"></script>
  <script src="fichas.js"></script>
  <script src="aula.js"></script>
  <script src="pizarra.js"></script>
  <script src="papelera.js"></script>

  <script>iniciar();</script>
</body>
</html>
